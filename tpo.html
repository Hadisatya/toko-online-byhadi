<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>PinkBliss - Toko Online Cantik</title>
  <!-- Font Awesome 6 (gratis) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Font: Poppins (modern & elegan) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tpo.css">
</head>
<body>

<header>
  <div class="container">
    <div class="navbar">
      <div class="logo">
        <i class="fas fa-heart" ></i> Aervy
      </div>
      <div class="nav-links">
        <a href="#" class="active">Beranda</a>
        <a href="#produk">Produk</a>
        <a href="#">Tentang</a>
        <div class="cart-icon" id="cartIcon">
          <i class="fas fa-shopping-bag"></i>
          <span class="cart-count" id="cartCount">0</span>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container hero-content">
    <div class="hero-text">
      <h1>Fits Better, <br> Feels Lighter</h1>
      <p>Koleksi eksklusif fashion & aksesoris dengan nuansa feminin terbaru. Rasakan kenyamanan dan keanggunan setiap hari.</p>
      <button class="btn-primary" id="shopNowBtn">Belanja Sekarang <i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="hero-img">
      <img src="img//fotologo1.png" alt="pink shopping">
    </div>
  </div>
</section>

<div class="container" id="produk">
  <div class="section-title">✨ Koleksi Terlaris ✨</div>
  <div class="product-grid" id="productGrid"></div>
</div>

<footer>
  <p><i class="fas fa-crown"></i> Aervy - Temukan Kebahagiaan dalam Gaya <i class="fas fa-heart" style="color:#f05a82;"></i></p>
  <p style="font-size: 0.8rem; margin-top: 10px;">&copy; 2026 Online Shop </p>
</footer>

<!-- Cart Sidebar -->
<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3><i class="fas fa-shopping-cart"></i> Keranjang Belanja</h3>
    <i class="fas fa-times close-cart" id="closeCartBtn"></i>
  </div>
  <div class="cart-items" id="cartItemsContainer">
    <!-- dynamic cart items -->
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotalPrice">Rp 0</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">Checkout <i class="fas fa-credit-card"></i></button>
  </div>
</div>

<script src="tpo.js"></script>
</body>
</html>
